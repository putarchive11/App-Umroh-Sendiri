<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Panduan lengkap umroh mandiri — persiapan, ibadah, checklist, dan kalkulator biaya." />
    <meta name="theme-color" content="#0A0907" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-title" content="Umroh Sendiri" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri+Quran&display=swap"
      rel="stylesheet"
    />
    <title>Umroh Sendiri</title>
    <script>
      // Terapkan tema tersimpan sebelum aplikasi tampil (mencegah layar berkedip).
      (function () {
        var t = "dark";
        try { t = localStorage.getItem("umroh_tema") === "light" ? "light" : "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#F6F0E1" : "#0A0907");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
